<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 320" role="img" aria-labelledby="title desc"><title id="title">Vestidor. Tu ropa, nuevas combinaciones.</title><desc id="desc">Una foto real se convierte en una prenda confirmada; la imagen de catálogo con IA es opcional.</desc><rect width="1080" height="320" rx="20" fill="#121510"/><g font-family="Arial, sans-serif"><text x="48" y="70" fill="#eef1e9" font-weight="700" font-size="40">Vestidor</text><text x="48" y="111" fill="#b0b9a9" font-size="22">Tu ropa. Nuevas combinaciones.</text><g fill="#20251c"><rect x="48" y="156" width="280" height="115" rx="14"/><rect x="400" y="156" width="280" height="115" rx="14"/><rect x="752" y="156" width="280" height="115" rx="14"/></g><g fill="#eef1e9" font-size="22" font-weight="600"><text x="70" y="196">Una foto real</text><text x="422" y="196">Ya está en tu ropero</text><text x="774" y="196">Imagen de catálogo</text></g><g fill="#b0b9a9" font-size="16"><text x="70" y="234">Cámara o galería del celular</text><text x="422" y="234">Nombre, categoría y colores</text><text x="774" y="234">Opcional, sin bloquear tu ropa</text></g><path d="M344 213h37m-9-9 9 9-9 9m325-9h37m-9-9 9 9-9 9" fill="none" stroke="#bfd5a7" stroke-width="3"/></g></svg>
